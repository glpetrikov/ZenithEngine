# advisories: RustSec vulnerability database checks
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained; pulled in transitively via winit -> sctk-adwaita
    # (Wayland client-side decoration text rendering). No safe upgrade exists yet;
    # revisit once winit/sctk-adwaita migrate off ab_glyph/ttf-parser.
    "RUSTSEC-2026-0192",
]

# licenses: allow-list approach is safer than deny-list for a growing dependency tree
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MIT-0",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

# bans: keep empty at first, fill in only if duplicate versions actually cause pain
[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
