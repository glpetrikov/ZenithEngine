[package]
name = "ZeroEditor"

edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
egui = "0.34.2"
egui_dock = "0.19.0"
egui-wgpu = "0.34.3"
egui-winit = "0.34.3"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
tracing = "0.1"
transform-gizmo-egui = "0.9.0"
winit = "0.30.13"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
ze_renderer = { path = "../ZeroEngine/crates/ze_renderer" }
ze_assets = { path = "../ZeroEngine/crates/ze_assets" }
ze_core = { path = "../ZeroEngine/crates/ze_core" }
ze_app = { path = "../ZeroEngine/crates/ze_app" }
ze_ecs = { path = "../ZeroEngine/crates/ze_ecs" }
ze_physics = { path = "../ZeroEngine/crates/ze_physics" }
ze_audio = { path = "../ZeroEngine/crates/ze_audio" }
ze_project = { path = "../ZeroEngine/crates/ze_project" }
ze_build = { path = "../ZeroEngine/crates/ze_build" }
ze_scripting_cs = { path = "../ZeroEngine/crates/ze_scripting_cs" }
ze_log = {path = "../ZeroEngine/crates/ze_log"}
egui_extras = { version = "0.34.3", features = ["syntect"] }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
] }
glam = "0.32.1"
bevy_reflect = "0.19.0-rc.2"
notify = "8.2.0"
ze_input = { path = "../ZeroEngine/crates/ze_input", features = ["winit"] }
ze_ui = { path = "../ZeroEngine/crates/ze_ui" }

[lints]
workspace = true
