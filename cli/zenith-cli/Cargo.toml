[package]
name = "zenith-cli"
edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "zenith-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
zenith-renderer = { version = "0.1.0", path = "../../crates/zenith-renderer" }
zenith_error = { version = "0.1.0", path = "../../crates/zenith_error" }
# Opens projects on disk.
zenith_filesystem = { version = "0.1.0", path = "../../crates/zenith_filesystem" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
