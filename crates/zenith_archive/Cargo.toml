[package]
name = "zenith_archive"
edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["write"]
# Writers and everything that is only needed while producing a build.
# The readers never depend on it (the web target builds without it).
write = ["dep:zstd"]

[dependencies]
zenith_error = { version = "0.1.0", path = "../zenith_error" }
ruzstd = "0.9.1"
# default-features are off: the default `getrandom` backend does not build
# on wasm32-unknown-unknown, and nonces are derived, never random.
aes-gcm-siv = { version = "0.11.1", default-features = false, features = [
    "aes",
    "alloc",
] }
# Not used directly: the `zeroize` feature makes the AES key schedule inside
# aes-gcm-siv wipe itself when the cipher is dropped.
aes = { version = "0.8", features = ["zeroize"] }
# `zeroize` makes the hash states wipe themselves when dropped (0.10 cannot).
sha2 = { version = "0.11", features = ["zeroize"] }
crc32fast = "1"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
zstd = { version = "0.13", optional = true }

# The integration tests build containers, so they need the writers.
[[test]]
name = "containers"
required-features = ["write"]

# Browsers have no OS entropy source; the `js` feature routes getrandom to
# `crypto.getRandomValues`. It only applies to wasm32-unknown-unknown.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3"
# Only to check the key derivation in crypto.rs against the reference crates.
hkdf = "0.12"
hmac = "0.12"
# The version hkdf and hmac are built on, for the same check.
sha2_reference = { package = "sha2", version = "0.10" }

[lints]
workspace = true
