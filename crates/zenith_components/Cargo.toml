[package]
name = "zenith_components"
edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bevy_ecs = { version = "0.19", features = [
    "multi_threaded",
    "trace",
    "serialize",
] }
zenith_entity_id = { version = "0.1.0", path = "../zenith_entity_id" }
serde = { version = "1", features = ["derive"] }
glam = { version = "0.33.3", default-features = false, features = [
    "std",
    "float-types",
    "fast-math",
    "bytemuck",
    "serde",
] }

[lints]
workspace = true
