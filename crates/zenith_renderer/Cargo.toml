[package]
name = "zenith_renderer"
edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
glam = { workspace = true }

winit = "0.30.13"
wgpu = { version = "30.0.1", features = ["webgl"] }
zenith_error = { version = "0.1.0", path = "../zenith_error" }
zenith_log = { version = "0.1.0", path = "../zenith_log" }
serde = "1.0.229"
bevy_ecs = { workspace = true }
bytemuck = "1.25.2"

image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }

# Only reads files, so it works without the `fs` feature (the browser has no folders).
zenith_filesystem = { version = "0.1.0", path = "../zenith_filesystem", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"

[lints]
workspace = true
