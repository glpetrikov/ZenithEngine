[workspace]
members = ["bins/zenith_editor", "bins/zenith_runtime", "cli/*", "crates/*"]
default-members = ["bins/zenith_editor"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR BlueOak-1.0.0"
authors = ["Gleb Petrikov"]
version = "0.1.0"
repository = "https://github.com/glpetrikov/ZenithEngine"
keywords = ["zenith", "game-engine", "zenith-engine"]
categories = ["game-engines"]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3 # 3, "s", "z"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
[profile.release.package."*"]
opt-level = "s" # 3, "s", "z"

[profile.dist]
inherits = "release"
opt-level = "s"      # 3, "s", "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
[profile.dist.package."*"]
opt-level = "z" # 3, "s", "z"

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Deny
unwrap_used = { level = "deny", priority = 1 }
expect_used = { level = "deny", priority = 1 }
float_cmp_const = { level = "deny", priority = 1 }
mem_forget = { level = "deny", priority = 1 }
fn_to_numeric_cast_any = { level = "deny", priority = 1 }
missing_assert_message = { level = "deny", priority = 1 }
cast_sign_loss = { level = "deny", priority = 1 }
missing_errors_doc = { level = "deny", priority = 1 }
missing_panics_doc = { level = "deny", priority = 1 }
dbg_macro = { level = "deny", priority = 1 }

# Allow
similar_names = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
unreachable = { level = "allow", priority = 1 }

# Deny on release
todo = { level = "allow", priority = 1 }
unimplemented = { level = "allow", priority = 1 }
panic = { level = "allow", priority = 1 }         # For zenith_editor panic handler testing
