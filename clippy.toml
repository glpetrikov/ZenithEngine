too-many-arguments-threshold = 8
type-complexity-threshold = 300
enum-variant-name-threshold = 4
cognitive-complexity-threshold = 30
too-many-lines-threshold = 200

# Panics in a browser; a game loop must not wait for a gamepad anyway.
disallowed-methods = [{ path = "gilrs::Gilrs::next_event_blocking", reason = "panics on the web; use next_event" }]
