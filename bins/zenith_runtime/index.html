<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #303030;
        }

        canvas {
            margin: 12px;
            width: calc(100% - 24px);
            height: calc(100% - 24px);
            border-radius: 16px;
        }

        /* TODO: change green and theme to dark-blue default zenith engine theme */

        dialog {
            border: 1px solid #606060;
            border-radius: 8px;
            padding: 24px;
            background: #262626;
            color: #E7E7E7;
            box-shadow: 0 12px 40px rgb(0 0 0 / 40%);
        }

        dialog::backdrop {
            background: rgb(0 0 0 / 55%);
        }

        dialog h2 {
            margin-bottom: 12px;
        }

        dialog p {
            margin-bottom: 20px;
            color: #BDBDBD;
        }

        dialog button {
            padding: 8px 16px;
            border: 0;
            border-radius: 5px;
            background: #3AA152;
            color: #FFFFFF;
            cursor: pointer;
        }

        dialog button:hover {
            background: #43AB5A;
        }
    </style>
</head>

<body>
    <canvas id="zenith-canvas"></canvas>
    <dialog id="no-webgpu">
        <h2>WebGPU is not available :(</h2>
        <p>Zenith Engine needs a browser with WebGPU support.</p>
        <button onclick="this.closest('dialog').close()">OK</button>
    </dialog>
    <dialog id="zenith-error">
        <h2>The game cannot start</h2>
        <p id="zenith-error-text"></p>
        <button onclick="this.closest('dialog').close()">OK</button>
    </dialog>

    <script type="module">
        function fail(message) {
            document.getElementById("zenith-error-text").textContent = message;
            document.getElementById("zenith-error").showModal();
        }
        // The runtime tells the page why it cannot start (no build, an
        // encrypted build, no GPU to draw with).
        window.addEventListener("zenith-error", (event) => fail(event.detail));

        if (location.protocol === "file:") {
            // A page opened as a file cannot load WebAssembly or the build.
            fail("Open this page through a web server, not as a file: browsers do not run it from file://. "
                + "For example, run \"npx serve\" or \"python -m http.server\" in this folder and open the address it prints.");
        } else if (!window.isSecureContext) {
            // WebGPU only exists on https:// or on localhost.
            fail("WebGPU needs a secure page: open it over https://, or on this computer through localhost.");
        } else if (!navigator.gpu) {
            document.getElementById("no-webgpu").showModal();
        } else {
            try {
                const { default: init } = await import("./pkg/zenith_runtime.js");
                await init();
            } catch (error) {
                fail("The runtime did not load: " + error);
            }
        }
    </script>
</body>

</html>
