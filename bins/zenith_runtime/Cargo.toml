# bins/runtime/Cargo.toml
[package]
name = "zenith_runtime"
edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "zenith"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Node",
] }
wgpu = { version = "30.0.1", features = ["webgl"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--all-features"]

[dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
pollster = "1.0.1"
dirs = "7.0.0"
console_error_panic_hook = "0.1.6"

zenith_error = { version = "0.1.0", path = "../../crates/zenith_error" }
zenith_log = { version = "0.1.0", path = "../../crates/zenith_log" }

zenith_renderer = { version = "0.1.0", path = "../../crates/zenith_renderer" }


[lints]
workspace = true
