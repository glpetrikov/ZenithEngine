# bins/runtime/Cargo.toml
[package]
name = "zenith_runtime"
edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "zenith"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Node",
] }
wgpu = { version = "30.0.1", features = ["webgl"] }

# Projects on disk (cap-std, rustix, the zstd C library) do not exist in the
# browser: there the game will open a build over the network instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zenith_filesystem = { version = "0.1.0", path = "../../crates/zenith_filesystem" }
zenith_build = { version = "0.1.0", path = "../../crates/zenith_build" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--all-features"]

[dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }
pollster = "1.0.1"
dirs = "7.0.0"
console_error_panic_hook = "0.1.6"
glam = { workspace = true }

zenith_error = { version = "0.1.0", path = "../../crates/zenith_error" }
zenith_log = { version = "0.1.0", path = "../../crates/zenith_log" }

zenith_renderer = { version = "0.1.0", path = "../../crates/zenith_renderer" }

zenith_world = { version = "0.1.0", path = "../../crates/zenith_world" }
zenith_components = { version = "0.1.0", path = "../../crates/zenith_components" }


[lints]
workspace = true
